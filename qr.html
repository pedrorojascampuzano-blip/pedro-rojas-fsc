<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escanéame · Pedro Rojas Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f3eee2;
  --line: #d6ccb4;
  --line-soft: #e3dac4;
  --ink: #1d2520;
  --ink-dim: #4d564f;
  --ink-mute: #8a8a7d;
  --accent: #4a6657;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 36px;
}
.stage { text-align: center; max-width: 640px; }
.kicker {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--accent);
  margin-bottom: 22px;
}
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: clamp(26px, 3.6vw, 38px);
  line-height: 1.12;
  letter-spacing: -0.018em;
  margin: 0 0 14px;
}
h1 em { color: var(--ink-dim); font-style: italic; font-weight: 400; }
.lede {
  font-size: 16px;
  color: var(--ink-dim);
  margin: 0 0 44px;
  max-width: 480px;
  margin-left: auto; margin-right: auto;
  line-height: 1.55;
}
.qr-card {
  display: inline-block;
  background: #fff;
  padding: 22px;
  border: 1px solid var(--line);
  border-radius: 4px;
}
.qr-card img { display: block; width: min(400px, 70vw); height: auto; }
.url {
  margin-top: 26px;
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 14px;
  color: var(--ink-mute);
}
.brand {
  margin-top: 48px;
  display: flex; align-items: baseline; justify-content: center; gap: 8px;
  color: var(--ink-dim);
  font-family: 'Fraunces', serif;
  font-weight: 400;
  font-size: 15px;
}
.brand-mark {
  display: inline-block;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent);
  transform: translateY(-2px);
}
</style>
</head>
<body>
<div class="stage">
  <div class="kicker">Escanéame</div>
  <h1>¿Hablamos de <em>certificación, MRV o créditos de carbono?</em></h1>
  <p class="lede">Apunta tu cámara aquí. Treinta minutos por video, sin costo.</p>
  <div class="qr-card">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https%3A%2F%2Fpedrorojascampuzano-blip.github.io%2Fpedro-rojas-fsc%2F&ecc=H&margin=2&color=1d2520&bgcolor=ffffff" alt="QR a pedrorojascampuzano-blip.github.io/pedro-rojas-fsc">
  </div>
  <div class="url">pedrorojascampuzano-blip.github.io/pedro-rojas-fsc</div>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>Pedro Rojas Consulting</span>
  </div>
</div>
</body>
</html>
