<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escanéame · Pedro Rojas Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e2018;
  --ink: #f3ecdc;
  --ink-dim: #c9c0a8;
  --ink-mute: #8a9588;
  --accent: #d7a85a;
  --accent-2: #7fb38a;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  -webkit-font-smoothing: antialiased;
  background-image:
    radial-gradient(1200px 600px at 80% -20%, rgba(215,168,90,0.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(127,179,138,0.08), transparent 60%);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
  padding: 28px;
}
.stage {
  text-align: center;
  max-width: 720px;
}
.kicker {
  display: inline-block;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  padding: 6px 14px;
  border: 1px solid rgba(215,168,90,0.35);
  border-radius: 999px;
  margin-bottom: 26px;
}
h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(28px, 4vw, 44px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin: 0 0 14px;
}
h1 em { color: var(--accent-2); font-style: italic; font-weight: 400; }
.lede {
  font-size: clamp(15px, 1.6vw, 18px);
  color: var(--ink-dim);
  margin: 0 0 36px;
  max-width: 540px;
  margin-left: auto; margin-right: auto;
}
.qr-card {
  display: inline-block;
  background: var(--ink);
  padding: 28px;
  border-radius: 22px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 6px rgba(215,168,90,0.18);
}
.qr-card img { display: block; width: min(420px, 70vw); height: auto; }
.url {
  margin-top: 28px;
  font-family: 'Inter', monospace;
  font-size: 14px;
  color: var(--ink-mute);
  letter-spacing: 0.02em;
}
.brand {
  margin-top: 44px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: var(--ink-dim);
  font-family: 'Fraunces', serif;
  font-size: 16px;
}
.brand-mark {
  width: 22px; height: 22px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
}
@media (max-width: 540px) {
  .qr-card { padding: 20px; border-radius: 16px; }
}
</style>
</head>
<body>
<div class="stage">
  <span class="kicker">Escanéame</span>
  <h1>¿Hablamos de <em>certificación, MRV o créditos de carbono?</em></h1>
  <p class="lede">Apunta tu cámara aquí. Te lleva a mi servicio. 30 minutos por video sin costo.</p>
  <div class="qr-card">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https%3A%2F%2Fpedrorojascampuzano-blip.github.io%2Fpedro-rojas-fsc%2F&ecc=H&margin=2&color=0e2018&bgcolor=f3ecdc" alt="QR a pedrorojascampuzano-blip.github.io/pedro-rojas-fsc">
  </div>
  <div class="url">pedrorojascampuzano-blip.github.io/pedro-rojas-fsc</div>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span>Pedro Rojas Consulting</span>
  </div>
</div>
</body>
</html>
